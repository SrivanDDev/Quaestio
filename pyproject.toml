[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quaestio"
version = "0.1.0"
description = "A Python toolkit for analyzing application logs and investigating system behavior."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Srivan Nagabhyru" }
]

dependencies = [
    "typer>=0.16",
    "rich>=14.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
quaestio = "quaestio.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]